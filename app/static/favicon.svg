<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="minGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
  <!-- Crystal / Hexagonal Cell Lattice -->
  <polygon points="32,12 48,22 48,42 32,52 16,42 16,22" fill="none" stroke="url(#minGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner Facets -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="16" y1="22" x2="48" y2="42" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="16" y1="42" x2="48" y2="22" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Central Oracle Core Nucleus -->
  <circle cx="32" cy="32" r="5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
</svg>
