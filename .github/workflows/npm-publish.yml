name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/typescript/**'
      - '.github/workflows/npm-publish.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install and Build SDK
        working-directory: sdk/typescript
        run: |
          npm install
          npm run build
          npm test

      - name: Publish package to npm
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on npm..."

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice ::Version $PKG_VERSION is already published on npm registry. Skipping publication step."
            exit 0
          fi

          echo "Publishing $PKG_NAME@$PKG_VERSION to npm (with provenance via OIDC / NPM_TOKEN)..."
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          else
            echo "::warning ::NPM_TOKEN not set in secrets, attempting OIDC provenance publish..."
            npm publish --access public --provenance
          fi
