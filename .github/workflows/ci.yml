name: Minerals Oracle CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  test:
    name: Test Suite & Multi-Chain Registry (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Execute Full Automated Test Suite (128 Tests)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v tests/

      - name: Validate Contract Verification & Multi-Chain Registry
        env:
          PYTHONPATH: .
        run: |
          python scripts/verify_contracts.py --chain all

  package-check:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build Wheel and Source Distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
